<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">

<title>Лондон · 17–21 ноября 2026 · Эдмонт и Эмма</title>
<meta name="description" content="План поездки в Лондон 17–21.11.2026">
<meta name="theme-color" content="#7d2e1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">

<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <h1 id="t-title"></h1>
          <div class="sub" id="t-sub"></div>
        </div>
        <div class="clocks" id="clocks" aria-live="off"></div>
      </div>
      <div class="countdown" id="countdown"></div>
    </header>

    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="panes">
      <section class="pane" id="pane-plan" role="tabpanel"></section>
      <section class="pane" id="pane-trip" role="tabpanel"></section>
      <section class="pane" id="pane-stay" role="tabpanel"></section>

      <section class="pane" id="pane-more" role="tabpanel"></section>
      <footer class="foot" id="foot"></footer>
    </main>
  </aside>

  <section class="mapwrap" id="pane-map" role="tabpanel">
    <div class="mapbar" id="mapbar">
      <div class="chips" id="dayFilter"></div>
      <div class="chips" id="catFilter"></div>
    </div>
    <div id="map"></div>
    <button class="locate" id="locate" type="button" aria-label="Где я"><span>◎</span></button>
  </section>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <button class="sheet-close" id="sheetClose" type="button" aria-label="Закрыть">✕</button>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="assets/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script src="xmas-data.js"></script>
